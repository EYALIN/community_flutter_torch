name: community_flutter_torch
description: "Torch: on/off, strength levels (Android 13+, iOS) and a state stream."
version: 2.0.1
homepage: https://github.com/EYALIN/community_flutter_torch
repository: https://github.com/EYALIN/community_flutter_torch
issue_tracker: https://github.com/EYALIN/community_flutter_torch/issues
funding:
  - https://github.com/sponsors/eyalin
topics:
  - torch
  - flashlight
  - flash
  - camera
  - quick-settings

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.community.flutter.torch
        pluginClass: CommunityFlutterTorchPlugin
      ios:
        pluginClass: CommunityFlutterTorchPlugin

